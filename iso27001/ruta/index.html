<style>
/* Concepto: carpeta de papeles de trabajo del auditor. Índice a la izquierda con referencias en monoespaciada, hojas con filas separadas a la derecha. */
:root{
  --bg:#F1F3F6; --sheet:#FFFFFF; --ink:#16202B; --mute:#566272; --line:#D6DCE5;
  --accent:#1F3F8F; --accent-ink:#FFFFFF; --soft:#E6ECF8;
  --ok:#17724A; --ok-bg:#E2F3EA; --ko:#B3261E; --ko-bg:#FBE7E5; --warn:#855000; --warn-bg:#FBF0DA;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --sheet:#151C26; --ink:#E7ECF3; --mute:#9AA7B8; --line:#2A3544;
  --accent:#8DB0FF; --accent-ink:#0E131A; --soft:#1B2740;
  --ok:#5CD39A; --ok-bg:#12301F; --ko:#FF8B80; --ko-bg:#3A1C1A; --warn:#F2B14C; --warn-bg:#36290F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --sheet:#151C26; --ink:#E7ECF3; --mute:#9AA7B8; --line:#2A3544;
  --accent:#8DB0FF; --accent-ink:#0E131A; --soft:#1B2740;
  --ok:#5CD39A; --ok-bg:#12301F; --ko:#FF8B80; --ko-bg:#3A1C1A; --warn:#F2B14C; --warn-bg:#36290F; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:600}
p{margin:.5em 0}
a{color:var(--accent)}
.mono,.tag{font-family:var(--f-mono)}
.shell{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-top:20px}
.top{max-width:1080px;margin:0 auto;padding-top:22px}
.top p{color:var(--mute);margin:.4em 0 0;max-width:62ch}
nav.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.idx button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:9px 10px;border-radius:6px;border-left:3px solid transparent;color:var(--mute);font-weight:500}
nav.idx button .n{font-family:var(--f-mono);font-size:.78rem;opacity:.8;min-width:1.6em}
nav.idx button:hover{background:var(--soft);color:var(--ink)}
nav.idx button[aria-current="page"]{background:var(--soft);color:var(--ink);border-left-color:var(--accent);font-weight:600}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.idx{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-direction:row;overflow-x:auto;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-inline:-2px}
  nav.idx button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;padding:8px 10px}
  nav.idx button[aria-current="page"]{border-bottom-color:var(--accent)}
}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.sheet.flat{border-radius:6px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mute{color:var(--mute)}
.small{font-size:.88rem}
.tag{display:inline-block;font-size:.76rem;padding:2px 7px;border:1px solid var(--line);border-radius:4px;color:var(--mute);background:var(--bg);white-space:nowrap}
.tag.new{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.btn{font:600 .95rem var(--f-body);background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:default}
.chip{font:500 .88rem var(--f-body);background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-weight:500;font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.tw{overflow-x:auto}
details.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px}
details.card>summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;gap:12px;align-items:baseline;font-family:var(--f-display);font-weight:600;font-size:1.1rem}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"+";font-family:var(--f-mono);color:var(--accent);min-width:1ch}
details.card[open]>summary::before{content:"–"}
details.card .body{padding:0 18px 16px}
.body ul{margin:.4em 0;padding-left:1.2em}
.body li{margin:.3em 0}
.note{border-left:4px solid var(--warn);background:var(--warn-bg);padding:9px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.note.fix{border-left-color:var(--ko);background:var(--ko-bg)}
.note.good{border-left-color:var(--ok);background:var(--ok-bg)}
.qtext{font-size:1.2rem;margin:10px 0 14px;font-family:var(--f-body);font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);width:100%}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-size:.82rem;min-width:1.7em;height:1.7em;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;color:var(--mute)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;border:1px solid var(--line)}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.ko{background:var(--ko-bg);border-color:var(--ko)}
.timer{font-family:var(--f-mono);font-weight:500;font-size:1.1rem}
.timer.low{color:var(--ko)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.qgrid button{font:500 .82rem var(--f-mono);padding:7px 0;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:4px;cursor:pointer}
.qgrid button.done{background:var(--soft);border-color:var(--accent)}
.qgrid button.flag{box-shadow:inset 0 -3px var(--warn)}
.qgrid button.cur{outline:2px solid var(--accent)}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}
input[type=text],input[type=search],select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;max-width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.day{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day b{font-family:var(--f-mono);font-weight:500;font-size:.82rem;color:var(--accent);min-width:3.2em}
.day label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.chip{transition:background .12s,border-color .12s}}
</style>

</head>
<body>
<div class="top">
  <h1>Ruta al examen ISO 27001</h1>
  <p>Auditor interno ISO/IEC 27001:2022. Teoría, práctica con casos y simulacros de 40 preguntas, con tu progreso guardado en este navegador. Material de estudio no oficial.</p>
</div>
<div class="shell">
  <nav class="idx" id="idx" aria-label="Secciones"></nav>
  <main id="view" aria-live="polite"></main>
</div>
<script>
/* ---------- Controles del Anexo A (nombres abreviados). * = nuevo en 2022 ---------- */
const CTRL_RAW = `5.1|Políticas de seguridad de la información
5.2|Roles y responsabilidades de seguridad
5.3|Segregación de funciones
5.4|Responsabilidades de la dirección

5.7|Inteligencia de amenazas|n

5.15|Control de acceso
5.16|Gestión de identidad
5.17|Información de autenticación
5.18|Derechos de acceso

5.21|Seguridad en la cadena de suministro de TIC

5.23|Seguridad en el uso de servicios en la nube|n
5.24|Planificación y preparación de la gestión de incidentes

5.26|Respuesta a incidentes
5.27|Aprender de los incidentes
5.28|Recolección de evidencia
5.29|Seguridad durante una interrupción
5.30|Preparación de las TIC para la continuidad|n
5.31|Requisitos legales, estatutarios, regulatorios y contractuales
5.32|Derechos de propiedad intelectual
5.33|Protección de registros
5.34|Privacidad y protección de datos personales
5.35|Revisión independiente de la seguridad
5.36|Cumplimiento de políticas, normas y estándares
5.37|Procedimientos operativos documentados
6.1|Verificación de antecedentes
6.2|Términos y condiciones de contratación
6.3|Concienciación, educación y capacitación
6.4|Proceso disciplinario
6.5|Responsabilidades tras terminar o cambiar el empleo
6.6|Acuerdos de confidencialidad

6.8|Reporte de eventos de seguridad
7.1|Perímetros de seguridad física
7.2|Entrada física
7.3|Seguridad de oficinas, salas e instalaciones
7.4|Monitoreo de la seguridad física|n
7.5|Protección contra amenazas físicas y ambientales
7.6|Trabajo en áreas seguras
7.7|Escritorio y pantalla limpios
7.8|Ubicación y protección de equipos
7.9|Seguridad de activos fuera de las instalaciones
7.10|Medios de almacenamiento
7.11|Servicios de suministro
7.12|Seguridad del cableado
7.13|Mantenimiento de equipos
7.14|Eliminación segura o reutilización de equipos
8.1|Dispositivos de punto final del usuario
8.2|Derechos de acceso privilegiado
8.3|Restricción de acceso a la información
8.4|Acceso al código fuente
8.5|Autenticación segura
8.6|Gestión de la capacidad
8.7|Protección contra malware
8.8|Gestión de vulnerabilidades técnicas
8.9|Gestión de la configuración|n
8.10|Eliminación de información|n
8.11|Enmascaramiento de datos|n
8.12|Prevención de fuga de datos|n
8.13|Copias de seguridad de la información
8.14|Redundancia de las instalaciones de procesamiento
8.15|Registro de eventos (logging)
8.16|Actividades de monitoreo|n
8.17|Sincronización de relojes
8.18|Uso de programas utilitarios privilegiados
8.19|Instalación de software en sistemas operativos
8.20|Seguridad de redes
8.21|Seguridad de los servicios de red
8.22|Segregación de redes
8.23|Filtrado web|n
8.24|Uso de criptografía
8.25|Ciclo de vida de desarrollo seguro
8.26|Requisitos de seguridad de las aplicaciones
8.27|Arquitectura de sistemas seguros e ingeniería
8.28|Codificación segura|n
8.29|Pruebas de seguridad en desarrollo y aceptación
8.30|Desarrollo subcontratado
8.31|Separación de entornos de desarrollo, prueba y producción
8.32|Gestión de cambios
8.33|Información de prueba
8.34|Protección de sistemas durante pruebas de auditoría`;
const CTRL = CTRL_RAW.split("\n").map(l => { const p = l.split("|"); return { id: p[0], name: p[1], nuevo: p[2] === "n" }; });
const CN = {}; CTRL.forEach(c => CN[c.id] = c.name);
const TEMAS_A = { "5": "Organizacionales", "6": "Personas", "7": "Físicos", "8": "Tecnológicos" };
const BLOQUES = [
  ["Accesos", ["5.15", "5.16", "5.17", "5.18", "8.2", "8.3", "8.5"]],
  ["Proveedores", ["5.19", "5.20", "5.21", "5.22", "5.23"]],
  ["Incidentes", ["5.24", "5.25", "5.26", "5.27", "5.28", "6.8"]],
  ["Continuidad", ["5.29", "5.30", "8.13", "8.14"]],
  ["Cumplimiento", ["5.31", "5.32", "5.33", "5.34", "5.35", "5.36", "5.37"]],
  ["Datos", ["5.12", "5.13", "5.14", "8.10", "8.11", "8.12", "8.24"]],
  ["Redes", ["8.20", "8.21", "8.22", "8.23"]],
  ["Desarrollo", ["8.25", "8.26", "8.27", "8.28", "8.29", "8.30", "8.31", "8.32", "8.33", "8.34"]],
  ["Monitoreo y logs", ["8.15", "8.16", "8.17", "7.4"]],
  ["Nuevos 2022", CTRL.filter(c => c.nuevo).map(c => c.id)]
];
/* ---------- Banco de preguntas (redactadas a partir de la norma ISO/IEC 27001:2022) ---------- */
const TEMAS = {
  fund: "Fundamentos y familia", c4: "Cláusula 4 · Contexto", c5: "Cláusula 5 · Liderazgo", c6: "Cláusula 6 · Riesgos y objetivos",
  c78: "Cláusulas 7 y 8", anexo: "Anexo A", ctrl: "Evidencia ↔ control", ind: "9.1 · Indicadores", aud: "9.2 · Auditoría y 19011",
  hall: "Clasifica el hallazgo", nc: "No conformidades", rev: "9.3 y 10", caso: "Casos integradores"
};
const BANK = [];
const cnt = {};
function add(t, q, o, a, w, r, fix) { cnt[t] = (cnt[t] || 0); BANK.push({ id: t + (cnt[t]++), t, q, o, a, w, r: r || "", fix: !!fix }); }

/* Fundamentos */
add("fund", "¿Qué norma de la familia 27000 contiene los requisitos contra los que se certifica una organización?", ["ISO/IEC 27000", "ISO/IEC 27001", "ISO/IEC 27002", "ISO/IEC 27005"], 1, "La 27001 es la única certificable. La 27000 da vocabulario, la 27002 guía de controles y la 27005 gestión de riesgos.", "Familia 27000");
add("fund", "La guía de implementación de los controles del Anexo A, con propósito y ejemplos, está en:", ["ISO/IEC 27002", "ISO/IEC 27003", "ISO/IEC 27004", "ISO 22301"], 0, "La 27002:2022 explica cada control. La 27003 guía la implementación del SGSI, la 27004 la medición y la 22301 la continuidad.", "ISO/IEC 27002");
add("fund", "Para definir métricas e indicadores del SGSI, ¿qué norma consultas?", ["ISO/IEC 27004", "ISO/IEC 27005", "ISO 19011", "ISO/IEC 27006"], 0, "La 27004 trata la medición del SGSI, con desempeño y efectividad.", "ISO/IEC 27004");
add("fund", "¿Qué norma ofrece directrices para auditar sistemas de gestión?", ["ISO 19011", "ISO/IEC 27000", "ISO/IEC 27005", "ISO 22301"], 0, "La 19011 guía programa, plan, conducción, informe y competencia del auditor. La 27006 fija requisitos para los organismos que certifican.", "ISO 19011");
add("fund", "¿Qué norma se usa para definir RTO, RPO y un plan de continuidad del negocio?", ["ISO 22301", "ISO/IEC 27001", "ISO 19011", "ISO/IEC 27004"], 0, "27001 no define tiempos de recuperación. El control 5.30 solo exige preparar las TIC. Para el BCP, el BIA y las pruebas se usa la 22301.", "ISO 22301");
add("fund", "Las cláusulas obligatorias y certificables de ISO 27001:2022 son:", ["1 a 10", "4 a 10", "5 a 10", "4 a 9"], 1, "Las cláusulas 1 a 3 son introductorias: objeto, referencias normativas y términos.", "Estructura");
add("fund", "Respecto del Anexo A es correcto afirmar que:", ["Los 93 controles son obligatorios para toda organización", "Se determinan los controles necesarios según el tratamiento de riesgos, se comparan con el Anexo A y se justifica lo excluido en la SoA", "Reemplaza el proceso de evaluación de riesgos", "No se pueden agregar controles que no estén en el Anexo A"], 1, "6.1.3 b a d. La nota 3 de 6.1.3 aclara que el Anexo A no es exhaustivo y se pueden añadir controles.", "6.1.3");
add("fund", "Las tres propiedades de la información que protege el SGSI son:", ["Confidencialidad, integridad y disponibilidad", "Eficacia, eficiencia y efectividad", "Identificación, autenticación y autorización", "Prevención, detección y respuesta"], 0, "Es la tríada CID. Las otras opciones son otros tríos de conceptos.", "Fundamentos");
add("fund", "El ciclo de mejora continua que sigue la estructura del SGSI es:", ["PHVA (planificar, hacer, verificar, actuar)", "FODA", "RACI", "PESTEL"], 0, "Planificar es la cláusula 6, hacer la 7 y 8, verificar la 9 y actuar la 10.", "Estructura");
add("fund", "La estructura común de cláusulas de las normas ISO de sistemas de gestión (9001, 14001, 22301, 27001) proviene del:", ["Anexo SL", "Anexo A", "Anexo B", "Anexo C"], 0, "El Anexo SL es la estructura de alto nivel compartida. Por eso 9001 y 27001 se integran.", "Anexo SL");

/* Cláusula 4 */
add("c4", "¿Qué cláusula exige determinar las cuestiones externas e internas pertinentes para el SGSI?", ["4.1", "4.2", "4.3", "4.4"], 0, "4.1 es el contexto de la organización. 4.2 son las partes interesadas, 4.3 el alcance y 4.4 el SGSI.", "4.1");
add("c4", "Una práctica habitual analiza el contexto externo con ___ y el interno con ___:", ["PESTEL / FODA", "FODA / PESTEL", "RACI / PESTEL", "BIA / FODA"], 0, "PESTEL mira lo externo y da amenazas y oportunidades. FODA se usa para lo interno: fortalezas y debilidades. La norma no impone técnicas.", "4.1");
add("c4", "En un FODA, fortalezas y debilidades provienen de:", ["Factores internos", "Factores externos", "Los requisitos legales", "Los proveedores"], 0, "Las oportunidades y amenazas son externas. Fortalezas y debilidades son internas.", "4.1");
add("c4", "¿Cuál NO es algo que 4.2 pide determinar?", ["Las partes interesadas relevantes", "Sus requisitos pertinentes", "Cuáles de esos requisitos se abordarán con el SGSI", "El presupuesto anual de cada parte interesada"], 3, "4.2 pide partes interesadas, sus requisitos y cuáles se abordan en el SGSI.", "4.2");
add("c4", "Un requisito legal o contractual es una ___ y un deseo no exigible es una ___:", ["necesidad / expectativa", "expectativa / necesidad", "vulnerabilidad / amenaza", "fortaleza / debilidad"], 0, "Criterio habitual. La norma dice que los requisitos de las partes interesadas pueden incluir requisitos legales, reglamentarios y contractuales.", "4.2");
add("c4", "Al determinar el alcance (4.3) la organización debe considerar:", ["Las cuestiones de 4.1, los requisitos de 4.2 y las interfaces y dependencias con otras organizaciones", "Solo los activos de TI", "Solo los requisitos del certificador", "Solo los controles del Anexo A"], 0, "Esos son los tres insumos. Un mapa de procesos ayuda a ver interfaces y dependencias.", "4.3");

<tr><td class="mono">7</td><td>Apoyo</td><td>7.1 recursos · 7.2 competencia · 7.3 conciencia · 7.4 comunicación · 7.5 información documentada</td></tr>
<tr><td class="mono">8</td><td>Operación</td><td>8.1 control operativo · 8.2 evaluar riesgos · 8.3 tratar riesgos</td></tr>
<tr><td class="mono">9</td><td>Evaluación</td><td>9.1 seguimiento y medición · 9.2 auditoría interna · 9.3 revisión por la dirección</td></tr>
<tr><td class="mono">10</td><td>Mejora</td><td>10.1 mejora continua · 10.2 no conformidad y acción correctiva</td></tr>
</tbody></table></div>
<p><b>Quién es el sujeto.</b> Alta dirección: 5.1, 5.2, 5.3 y 9.3. La organización: 9.2 y la mayoría del resto. Propietarios de los riesgos: aprobar el plan y aceptar el riesgo residual (6.1.3 f).</p>
<p class="mute small">Las cláusulas 1 a 3 son introductorias y no se certifican.</p>` },

{ id: "t3", ref: "4.1 a 4.4", title: "Cláusula 4: contexto, partes interesadas y alcance", body: `
<ul>
<li><b>4.1:</b> determinar cuestiones externas e internas. Una práctica habitual: PESTEL para lo externo (amenazas y oportunidades) y FODA para lo interno (fortalezas y debilidades). En esta fase no se filtra nada.</li>
<li><b>4.2:</b> partes interesadas relevantes, sus requisitos pertinentes y cuáles se abordarán con el SGSI. Los requisitos pueden ser legales, reglamentarios y contractuales. Distinción habitual: necesidad (obligatoria) y expectativa (deseo).</li>
<li><b>4.3:</b> el alcance considera 4.1, 4.2 e interfaces y dependencias con otras organizaciones. Debe estar documentado.</li>
<li><b>4.4:</b> establecer, implementar, mantener y mejorar continuamente el SGSI.</li>
</ul>
<div class="note good"><b>Idea útil:</b> el alcance no es lo mismo que el Anexo A. Lo que declaras en el alcance te obliga a identificar activos y riesgos. Para el resto usas los controles de la SoA como visión de cumplimiento.</div>` },

{ id: "t4", ref: "5.1 a 5.3", title: "Cláusula 5: liderazgo, política y roles", body: `
<ul>
<li><b>5.1:</b> la alta dirección demuestra liderazgo y compromiso. Lista de la norma: política y objetivos compatibles con la estrategia, integración del SGSI en los procesos, recursos disponibles, comunicar la importancia, lograr los resultados previstos, dirigir y apoyar a las personas, promover la mejora continua y apoyar a otros roles gerenciales.</li>
<li><b>5.2 contenido:</b> apropiada al propósito de la organización; incluye objetivos o el marco para fijarlos; compromiso de satisfacer los requisitos aplicables; compromiso de mejora continua.</li>
<li><b>5.2 además:</b> estar documentada, comunicarse dentro de la organización y estar disponible para las partes interesadas según corresponda.</li>
<li><b>5.3:</b> la alta dirección asegura que responsabilidades y autoridades de los roles de seguridad se asignen y comuniquen, y asigna responsabilidad para asegurar la conformidad del SGSI e informar su desempeño.</li>
</ul>
<div class="note"><b>Ojo con los resúmenes.</b> Algunos presentan «recursos, integración, comunicación y roles asignados» como las responsabilidades de 5.1. En la norma, «roles asignados y comunicados» es 5.3 y 5.1 tiene ocho puntos (a a h). Además, «comunicada» sí es un requisito de la política (5.2 f).</div>` },

{ id: "t5", ref: "6.1 a 6.3", title: "Cláusula 6: riesgos, SoA y objetivos", body: `
<ul>
<li><b>6.1.2 evaluación:</b> definir criterios de aceptación del riesgo y criterios para evaluar; resultados consistentes, válidos y comparables; identificar riesgos y sus propietarios; analizar (consecuencias, probabilidad, nivel); evaluar y priorizar.</li>
<li><b>Escenario de riesgo:</b> activo + amenaza + vulnerabilidad. Nivel = impacto × probabilidad.</li>
<li><b>Niveles:</b> inherente (sin controles), actual (con controles existentes, no es un término de la norma), residual (tras el plan de tratamiento).</li>
<li><b>Opciones de tratamiento:</b> reducir o mitigar, aceptar o retener, transferir o compartir, evitar.</li>
<li><b>6.1.3 tratamiento:</b> elegir opciones, determinar controles necesarios, compararlos con el Anexo A, producir la SoA, formular el plan, y que los propietarios aprueben el plan y acepten el riesgo residual.</li>
<li><b>SoA:</b> controles necesarios, justificación de inclusión, si están implementados o no, y justificación de exclusión de los del Anexo A.</li>
<li><b>6.2 objetivos:</b> coherentes con la política, medibles si es factible, consideran requisitos y resultados del riesgo, monitoreados, comunicados, actualizados y documentados. Planificar qué, recursos, quién, cuándo y cómo evaluar.</li>
<li><b>6.3 (nueva en 2022):</b> los cambios al SGSI se hacen de forma planificada.</li>
</ul>
<div class="note good"><b>Regla práctica:</b> los controles preventivos y detectivos bajan la probabilidad. Los correctivos, como un seguro, bajan el impacto.</div>` },

{ id: "t6", ref: "7.1 a 8.3", title: "Cláusulas 7 y 8: apoyo y operación", body: `
<ul>
<li><b>7.1</b> recursos para establecer, implementar, mantener y mejorar el SGSI.</li>
<li><b>7.2</b> competencia: educación, formación o experiencia, y evidencia documentada.</li>
<li><b>7.3</b> conciencia: política, contribución al SGSI y consecuencias de incumplir.</li>
<li><b>7.4</b> comunicación: qué, cuándo, con quién y cómo.</li>
<li><b>7.5</b> información documentada: creación (identificación, formato, revisión y aprobación) y control (disponibilidad, protección, distribución, versiones, retención y disposición).</li>
<li><b>8.1</b> planificar y controlar los procesos, controlar cambios y los procesos externalizados.</li>
<li><b>8.2</b> evaluar riesgos a intervalos planificados o ante cambios significativos. <b>8.3</b> implementar el plan de tratamiento.</li>
</ul>` },

{ id: "t7", ref: "Anexo A", title: "Anexo A: 93 controles", body: `
<ul>
<li><b>4 temas:</b> A.5 organizacionales (37), A.6 personas (8), A.7 físicos (14), A.8 tecnológicos (34).</li>
<li><b>Cambios 2022:</b> de 114 a 93. 56 controles de 2013 se fusionaron en 24, y hay 11 nuevos: 5.7, 5.23, 5.30, 7.4, 8.9, 8.10, 8.11, 8.12, 8.16, 8.23 y 8.28.</li>
<li><b>Atributos (27002:2022):</b> preventivo, detectivo, correctivo. Por ejemplo, 8.16 es detectivo.</li>
<li><b>Uso:</b> se determinan los controles que el tratamiento necesita, se comparan con el Anexo A y se justifica la SoA. La 27002 es la guía de cómo implementarlos.</li>
</ul>
<p class="small mute">Usa el buscador de abajo en la sección «Controles» para ubicar un control por número, nombre o bloque. Los nombres están abreviados y el texto oficial está en tu PDF de la norma.</p>` },

{ id: "t8", ref: "9.1 y 27004", title: "Cláusula 9.1: seguimiento y medición", body: `
<ul>
<li>La organización determina qué medir (procesos y controles), los métodos (comparables y reproducibles), cuándo medir, quién mide, cuándo se analizan los resultados y quién los evalúa. Debe haber información documentada como evidencia.</li>
<li><b>Desempeño:</b> tarea o control con inicio y fin («se hizo»). Ejemplo: % de equipos con antivirus.</li>
<li><b>Efectividad:</b> si funcionó y logró los objetivos de seguridad; se enfoca en riesgos, incidentes y personas. Ejemplo: % de incidentes de malware contenidos antes de causar daño.</li>
<li><b>Niveles del cuadro de mando:</b> operativo (equipo técnico), táctico (jefe de seguridad), estratégico (alta dirección).</li>
<li><b>Ficha del indicador:</b> necesidad, medida, fórmula, frecuencia, tipo, umbrales tipo semáforo, responsables, fuente de datos y control relacionado.</li>
<li>Un indicador de desempeño puede evolucionar a uno de efectividad. Cuida que la fuente de datos sea completa.</li>
</ul>` },

{ id: "t9", ref: "9.2 y 19011", title: "Auditoría interna (9.2) e ISO 19011", body: `
<ul>
<li><b>9.2.1:</b> la organización audita a intervalos planificados si el SGSI se ajusta a sus propios requisitos y a los de la norma, y se implementa y mantiene de forma efectiva.</li>
<li><b>9.2.2 programa:</b> frecuencia, métodos, responsabilidades, planificación e informes; considera la importancia de los procesos y las auditorías previas; define criterios y alcance; selecciona auditores objetivos e imparciales; informa a la dirección pertinente; conserva información documentada.</li>
<li><b>Programa vs plan:</b> programa = calendario de auditorías en un periodo. Plan = detalle de una auditoría.</li>
<li><b>Tipos:</b> primera parte (interna, 9.2), segunda parte (clientes o entes de control), tercera parte (certificación).</li>
<li><b>Conceptos:</b> evidencia objetiva, criterio de auditoría y hallazgo (conformidad o no conformidad). Una oportunidad de mejora no es una no conformidad.</li>
<li><b>Roles:</b> quien gestiona el programa nombra al equipo. El auditor líder asigna responsabilidades al equipo y responde por el informe.</li>
<li><b>Reuniones:</b> en la apertura se dan a conocer las condiciones para terminar la auditoría. En el cierre se presentan hallazgos y conclusiones y se explican las actividades posteriores.</li>
<li><b>Entrevistas:</b> preguntas abiertas. Las listas de verificación apoyan, no reemplazan el juicio.</li>
<li><b>Métodos:</b> en sitio o remotos, con o sin interacción humana.</li>
<li><b>Informe:</b> objetivos, alcance, cliente, equipo y participantes, fechas y lugares, criterios, hallazgos con evidencia y conclusiones.</li>
<li><b>Imparcialidad:</b> nadie audita su propia área. Auditorías cruzadas.</li>
</ul>
<div class="note"><b>Prácticas habituales que no son requisito de la norma:</b> que la alta dirección autorice el programa y frecuencias sugeridas (trimestral al empezar, anual con madurez).</div>` },

{ id: "t10", ref: "Hallazgos y no conformidades", title: "Clasificar hallazgos y redactar no conformidades", body: `
<div class="tw"><table><thead><tr><th>Hallazgo</th><th>Cuándo</th></tr></thead><tbody>
<tr><td><b>No conformidad</b></td><td>Incumple un requisito de la norma o propio. Mayor: incumple por completo un requisito integral. Menor: incumple parcialmente.</td></tr>
<tr><td><b>Observación</b></td><td>Aún no incumple, pero podría convertirse en no conformidad si no se trata.</td></tr>
<tr><td><b>Oportunidad de mejora</b></td><td>No hay incumplimiento. Mejoraría la eficacia del proceso.</td></tr>
</tbody></table></div>
<p><b>Fórmula de redacción:</b> evidencia objetiva (qué y cuánto se encontró), referencia al requisito incumplido (cláusula, control o documento propio) y conclusión.</p>
<p><b>Ejemplo:</b> «En la consola se evidenció que 15 de 120 estaciones no tienen antivirus desde hace más de 60 días, incumpliendo el control 8.7 y la política que exige antivirus en todos los equipos.»</p>
<p><b>Ciclo:</b> identificar, redactar, clasificar, investigar causa raíz (Ishikawa o cinco porqués), definir acción, aprobar el plan, verificar la efectividad y cerrar. 10.2: reaccionar, evaluar causas, implementar, revisar efectividad y cambiar el SGSI si es necesario.</p>
<p>Cita el control que más se apega al hallazgo para evitar disputas.</p>` },

{ id: "t11", ref: "9.3, 10.1 y 10.2", title: "Revisión por la dirección y mejora", body: `
<ul>
<li><b>9.3.1:</b> la alta dirección revisa el SGSI a intervalos planificados para asegurar su idoneidad, adecuación y eficacia continuas.</li>
<li><b>9.3.2 entradas:</b> estado de acciones previas; cambios en cuestiones y en partes interesadas; desempeño (no conformidades, monitoreo y medición, auditorías, objetivos); retroalimentación de partes interesadas; resultados de riesgos y estado del plan de tratamiento; oportunidades de mejora.</li>
<li><b>9.3.3 resultados:</b> decisiones sobre mejora continua y cambios en el SGSI, con evidencia documentada.</li>
<li><b>10.1:</b> mejorar idoneidad, adecuación y eficacia.</li>
<li><b>10.2:</b> reaccionar, evaluar causas, implementar, revisar efectividad y, si procede, cambiar el SGSI. Conservar evidencia de las no conformidades y de las acciones.</li>
</ul>` },

{ id: "t12", ref: "Familia 27000", title: "Qué norma usar para qué", body: `
<div class="tw"><table><thead><tr><th>Norma</th><th>Uso</th></tr></thead><tbody>
<tr><td class="mono">ISO/IEC 27000</td><td>Vocabulario y visión general</td></tr>
<tr><td class="mono">ISO/IEC 27001</td><td>Requisitos del SGSI. Única certificable</td></tr>
<tr><td class="mono">ISO/IEC 27002</td><td>Guía de implementación de los controles</td></tr>
<tr><td class="mono">ISO/IEC 27003</td><td>Guía de implementación del SGSI</td></tr>
<tr><td class="mono">ISO/IEC 27004</td><td>Medición, indicadores y métricas</td></tr>
<tr><td class="mono">ISO/IEC 27005</td><td>Gestión de riesgos de seguridad de la información</td></tr>
<tr><td class="mono">ISO/IEC 27006</td><td>Requisitos para organismos que auditan y certifican</td></tr>
<tr><td class="mono">ISO 19011</td><td>Directrices para auditar sistemas de gestión</td></tr>
<tr><td class="mono">ISO 22301</td><td>Continuidad del negocio: BIA, RTO, RPO, BCP</td></tr>
</tbody></table></div>
<p class="small mute">Marcos complementarios: TOGAF (arquitectura empresarial), NIST, CIS Controls y Magerit.</p>` },

{ id: "t13", ref: "Verifica", title: "Diferencias que conviene verificar", body: `
<ul>
<li><b>Cuentas de la versión 2022.</b> 114 − 56 fusionados + 24 resultantes + 11 nuevos = 93. Si un material te da cifras por tema que no suman 56, no las memorices.</li>
<li><b>Numeración.</b> Los números de control cambiaron entre 2013 y 2022. Por ejemplo, la inteligencia de amenazas es 5.7 y la verificación de antecedentes es 6.1 (antes A.7.1.1).</li>
<li><b>Riesgo «actual».</b> Es un término de uso común en metodologías, no de la norma, que habla de riesgo y de riesgo residual.</li>
<li><b>Resúmenes de cláusula 5.</b> Contrasta siempre con el texto: 5.1 tiene ocho puntos, los roles son 5.3 y la comunicación de la política es 5.2 f.</li>
<li><b>Bancos de preguntas de terceros.</b> Si una respuesta no cuadra con la norma, confía en la norma y busca la cláusula exacta.</li>
</ul>` }
];
/* ---------- Estado y almacenamiento ---------- */
const KEY = "ruta27001";
let S = { stats: {}, sims: [], checks: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const view = $("#view");
const LET = "ABCDEFGH";
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(n, d) { return d ? Math.round(100 * n / d) : 0; }
function record(q, ok) { const s = S.stats[q.id] || (S.stats[q.id] = { ok: 0, ko: 0, last: null }); if (ok) s.ok++; else s.ko++; s.last = ok; }
function mastery(t) {
  const qs = BANK.filter(q => t === "all" || q.t === t);
  const seen = qs.filter(q => S.stats[q.id]).length;
  const good = qs.filter(q => S.stats[q.id] && S.stats[q.id].last === true).length;
  return { total: qs.length, seen, good };
}
function makeSession(qs, mode, limitSec) {
  return { qs: qs.map(q => ({ q, order: q.fix ? q.o.map((_, i) => i) : shuffle(q.o.map((_, i) => i)) })), i: 0, ans: {}, flag: {}, mode, t0: Date.now(), limit: limitSec || 0, done: false };
}

/* ---------- Navegación ---------- */
const NAV = [["inicio", "Inicio"], ["teoria", "Teoría"], ["practica", "Práctica"], ["banco", "Banco"], ["simulacro", "Simulacro"], ["errores", "Mis errores"]];
$("#idx").innerHTML = NAV.map((n, i) => `<button data-v="${n[0]}"><span class="n">0${i + 1}</span>${n[1]}</button>`).join("");
$("#idx").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { sess = null; stopTimer(); location.hash = b.dataset.v; } });
let sess = null, timer = null;
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function route() {
  const v = (location.hash || "#inicio").slice(1);
  const name = NAV.some(n => n[0] === v) ? v : "inicio";
  document.querySelectorAll("#idx button").forEach(b => b.setAttribute("aria-current", b.dataset.v === name ? "page" : "false"));
  if (name !== "simulacro" && name !== "banco" && name !== "practica") { sess = null; stopTimer(); }
  ({ inicio: vInicio, teoria: vTeoria, practica: vPractica, banco: vBanco, simulacro: vSim, errores: vErrores })[name]();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { if (sess && !sess.done) { /* mantiene la sesión si se vuelve a la misma vista */ } route(); });

/* ---------- Inicio ---------- */
const PLAN = [
  ["Día 1", "Teoría: examen, mapa de la norma, cláusulas 4 y 5. Banco: Fundamentos, 4 y 5."],
  ["Día 2", "Teoría: cláusula 6. Práctica: casos integradores. Banco: cláusula 6."],
  ["Día 3", "Cláusulas 7 y 8 y Anexo A. Práctica: evidencia ↔ control."],
  ["Día 4", "9.1 e indicadores. Práctica: desempeño o efectividad."],
  ["Día 5", "9.2 e ISO 19011. Banco: Auditoría. Es el tema más pesado."],
  ["Día 6", "Hallazgos, no conformidades, 9.3 y 10. Repasa Mis errores."],
  ["Día 7", "Dos simulacros. Meta: 90 % o más. Repite lo fallado."]
];
function vInicio() {
  const m = mastery("all");
  const last = S.sims[S.sims.length - 1];
  const rows = Object.keys(TEMAS).map(t => { const x = mastery(t); return `<tr><td>${TEMAS[t]}</td><td class="mono">${x.good}/${x.total}</td><td style="width:34%"><div class="bar ${x.good === x.total && x.total ? "ok" : ""}"><i style="width:${pct(x.good, x.total)}%"></i></div></td></tr>`; }).join("");
  view.innerHTML = `
  <section class="sheet"><div class="row sp"><div><h2>Tu avance</h2><p class="mute small">Dominada = acertaste la última vez que respondiste esa pregunta.</p></div>
  <div><span class="big">${pct(m.good, m.total)}%</span> <span class="mute small">${m.good} de ${m.total} dominadas · ${m.seen} vistas</span></div></div>
  <div class="tw" style="margin-top:8px"><table><thead><tr><th>Tema</th><th>Dominadas</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="sheet"><div class="row sp"><h2>Último simulacro</h2>${last ? `<span class="mono">${last.score}/${last.total} · ${pct(last.score, last.total)}% · ${last.pass ? "aprobado" : "no aprobado"}</span>` : `<span class="mute">Aún no has hecho ninguno</span>`}</div>
  <div class="row" style="margin-top:12px"><button class="btn" data-go="simulacro">Hacer un simulacro</button><button class="btn ghost" data-go="teoria">Repasar teoría</button><button class="btn ghost" data-go="errores">Ver mis errores</button></div></section>
  <section class="sheet"><h2>Ruta de 7 días</h2><p class="mute small">Marca cada día cuando lo cumplas.</p>
  ${PLAN.map((p, i) => `<div class="day"><b>${p[0]}</b><label><input type="checkbox" id="chk${i}" data-i="${i}" ${S.checks[i] ? "checked" : ""}><span>${p[1]}</span></label></div>`).join("")}</section>
  <section class="sheet"><h3>Sobre este material</h3><p class="small mute">Las preguntas son originales y están redactadas a partir de la norma ISO/IEC 27001:2022. No incluyen preguntas de exámenes reales ni material de ningún curso. Es material de estudio no oficial y no está afiliado a ISO ni a CertiProf. Para el texto autorizado de las normas, consulta las normas originales.</p></section>`;
  view.onclick = e => {
    const g = e.target.closest("[data-go]"); if (g) location.hash = g.dataset.go;
  };
  view.onchange = e => { const c = e.target.closest("input[data-i]"); if (c) { S.checks[c.dataset.i] = c.checked; save(); } };
}

/* ---------- Teoría ---------- */
function vTeoria() {
  view.innerHTML = THEORY.map((t, i) => `<details class="card" ${i === 0 ? "open" : ""}><summary><span>${esc(t.title)}</span><span class="tag">${esc(t.ref)}</span></summary><div class="body">${t.body}</div></details>`).join("") +
  `<section class="sheet" id="ctrls"><h2>Controles del Anexo A</h2>
  <div class="row" style="margin:10px 0"><input type="search" id="cq" placeholder="Número, palabra o tema" aria-label="Buscar control" style="flex:1 1 220px"></div>
  <div class="row" id="cb" style="margin-bottom:10px">${BLOQUES.map((b, i) => `<button class="chip" data-b="${i}" aria-pressed="false">${b[0]}</button>`).join("")}</div>
  <div class="tw"><table><thead><tr><th>Control</th><th>Nombre</th><th>Tema</th></tr></thead><tbody id="cl"></tbody></table></div>
  <p class="small mute" id="cc"></p></section>`;
  let blk = -1;
  const draw = () => {
    const q = $("#cq").value.trim().toLowerCase();
    const list = CTRL.filter(c => (blk < 0 || BLOQUES[blk][1].includes(c.id)) && (!q || (c.id + " " + c.name + " " + TEMAS_A[c.id[0]]).toLowerCase().includes(q)));
    $("#cl").innerHTML = list.map(c => `<tr><td class="mono">A.${c.id}${c.nuevo ? ' <span class="tag new">nuevo</span>' : ""}</td><td>${esc(c.name)}</td><td class="mute">${TEMAS_A[c.id[0]]}</td></tr>`).join("");
    $("#cc").textContent = list.length + " de 93 controles";
  };
  $("#cq").oninput = draw;
  $("#cb").onclick = e => { const b = e.target.closest("button"); if (!b) return; const i = +b.dataset.b; blk = blk === i ? -1 : i; document.querySelectorAll("#cb button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.b === blk))); draw(); };
  draw();
  view.onclick = null; view.onchange = null;
}

/* ---------- Sesiones de preguntas (estudio y simulacro) ---------- */
function qCard(s, opts) {
  const it = s.qs[s.i], q = it.q, ans = s.ans[s.i], study = s.mode === "study", shown = study && ans !== undefined;
  const optsHtml = it.order.map((oi, k) => {
    let cls = "opt";
    if (shown) { if (oi === q.a) cls += " ok"; else if (ans === oi) cls += " ko"; }
    else if (ans === oi) cls += " sel";
    return `<button class="${cls}" data-o="${oi}" ${shown ? "disabled" : ""}><span class="l">${LET[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
  const fb = shown ? `<div class="fb ${ans === q.a ? "ok" : "ko"}"><b>${ans === q.a ? "Correcto." : "Incorrecto."}</b> ${esc(q.w)} ${q.r ? `<span class="tag">${esc(q.r)}</span>` : ""}</div>` : "";
  return `<div class="row sp"><span class="tag">${esc(TEMAS[q.t])}</span><span class="mono mute">${s.i + 1} / ${s.qs.length}</span></div>
  <p class="qtext">${esc(q.q)}</p><div class="opts">${optsHtml}</div>${fb}`;
}
function renderSession(host, backLabel) {
  const s = sess;
  if (s.done) return renderResult(host, backLabel);
  const study = s.mode === "study";
  const answered = Object.keys(s.ans).length;
  let head = "";
  if (!study) {
    head = `<div class="row sp"><span class="timer" id="clk"></span><span class="mono mute">${answered}/${s.qs.length} respondidas</span></div>
    <div class="qgrid" style="margin:10px 0 14px">${s.qs.map((_, i) => `<button data-n="${i}" class="${s.ans[i] !== undefined ? "done" : ""} ${s.flag[i] ? "flag" : ""} ${i === s.i ? "cur" : ""}">${i + 1}</button>`).join("")}</div>`;
  }
  const canNext = study ? s.ans[s.i] !== undefined : true;
  const last = s.i === s.qs.length - 1;
  host.innerHTML = `<section class="sheet">${head}${qCard(s)}
  <div class="row sp" style="margin-top:16px"><div class="row">
    <button class="btn ghost sm" data-a="prev" ${s.i === 0 ? "disabled" : ""}>Anterior</button>
    ${study ? "" : `<button class="btn ghost sm" data-a="flag">${s.flag[s.i] ? "Quitar marca" : "Marcar para revisar"}</button>`}</div>
  <div class="row">${study ? `<button class="btn ghost sm" data-a="quit">Salir</button>` : ""}
    ${last ? `<button class="btn" data-a="finish" ${canNext ? "" : "disabled"}>Terminar</button>` : `<button class="btn" data-a="next" ${canNext ? "" : "disabled"}>Siguiente</button>`}</div></div></section>`;
  host.onclick = e => {
    const o = e.target.closest(".opt");
    if (o && !o.disabled) {
      const oi = +o.dataset.o, q = s.qs[s.i].q;
      if (study) { if (s.ans[s.i] !== undefined) return; s.ans[s.i] = oi; record(q, oi === q.a); save(); renderSession(host, backLabel); return; }
      s.ans[s.i] = oi; renderSession(host, backLabel); return;
    }
    const n = e.target.closest("[data-n]"); if (n) { s.i = +n.dataset.n; renderSession(host, backLabel); return; }
    const a = e.target.closest("[data-a]"); if (!a) return;
    const act = a.dataset.a;
    if (act === "next") s.i++; else if (act === "prev") s.i--; else if (act === "flag") s.flag[s.i] = !s.flag[s.i];
    else if (act === "quit") { sess = null; route(); return; }
    else if (act === "finish") { finish(); renderSession(host, backLabel); return; }
    renderSession(host, backLabel);
  };
  if (!study) tick();
}
function finish() {
  const s = sess; s.done = true; stopTimer();
  s.score = s.qs.reduce((n, it, i) => n + (s.ans[i] === it.q.a ? 1 : 0), 0);
  s.secs = Math.round((Date.now() - s.t0) / 1000);
  if (s.mode === "sim") {
    s.qs.forEach((it, i) => record(it.q, s.ans[i] === it.q.a));
    S.sims.push({ date: new Date().toISOString().slice(0, 10), score: s.score, total: s.qs.length, secs: s.secs, pass: pct(s.score, s.qs.length) >= 80 }); save();
  } else save();
}
function renderResult(host, backLabel) {
  const s = sess, p = pct(s.score, s.qs.length), pass = p >= 80;
  const by = {};
  s.qs.forEach((it, i) => { const t = it.q.t; by[t] = by[t] || [0, 0]; by[t][1]++; if (s.ans[i] === it.q.a) by[t][0]++; });
  const mm = Math.floor(s.secs / 60), ss = String(s.secs % 60).padStart(2, "0");
  const wrong = s.qs.map((it, i) => ({ it, i })).filter(x => s.ans[x.i] !== x.it.q.a);
  host.innerHTML = `<section class="sheet"><div class="row sp"><div><h2>${s.mode === "sim" ? "Resultado del simulacro" : "Resultado"}</h2><p class="mute small">Tiempo: ${mm}:${ss}. Se aprueba con 80 %.</p></div>
  <div><span class="big" style="color:var(--${pass ? "ok" : "ko"})">${p}%</span> <span class="mono mute">${s.score}/${s.qs.length}</span></div></div>
  <div class="tw" style="margin-top:10px"><table><thead><tr><th>Tema</th><th>Aciertos</th></tr></thead><tbody>${Object.keys(by).map(t => `<tr><td>${TEMAS[t]}</td><td class="mono">${by[t][0]}/${by[t][1]}</td></tr>`).join("")}</tbody></table></div>
  <div class="row" style="margin-top:14px"><button class="btn" data-a="again">${wrong.length ? "Repetir solo lo fallado" : "Hacer otra ronda"}</button><button class="btn ghost" data-a="back">${esc(backLabel)}</button></div></section>
  ${wrong.length ? `<section class="sheet"><h3>Lo que fallaste (${wrong.length})</h3>${wrong.map(x => { const q = x.it.q, a = s.ans[x.i]; return `<div class="fb ko" style="margin-top:10px"><p style="margin:0 0 6px"><b>${esc(q.q)}</b></p><p class="small" style="margin:0">Tu respuesta: ${a === undefined ? "sin responder" : esc(q.o[a])}</p><p class="small" style="margin:0"><b>Correcta:</b> ${esc(q.o[q.a])}</p><p class="small" style="margin:4px 0 0">${esc(q.w)} ${q.r ? `<span class="tag">${esc(q.r)}</span>` : ""}</p></div>`; }).join("")}</section>` : ""}`;
  host.onclick = e => {
    const a = e.target.closest("[data-a]"); if (!a) return;
    if (a.dataset.a === "back") { sess = null; route(); return; }
    if (a.dataset.a === "again") { const pool = wrong.length ? wrong.map(x => x.it.q) : s.qs.map(it => it.q); sess = makeSession(shuffle(pool), "study"); renderSession(view, backLabel); window.scrollTo(0, 0); }
  };
}
function tick() {
  stopTimer();
  const s = sess; if (!s || s.mode !== "sim") return;
  const upd = () => {
    const left = Math.max(0, s.limit - Math.floor((Date.now() - s.t0) / 1000)), c = $("#clk"); if (!c) return;
    c.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    c.classList.toggle("low", left < 300);
    if (left === 0) { finish(); renderSession(view, "Volver al simulacro"); }
  };
  upd(); timer = setInterval(upd, 1000);
}

/* ---------- Práctica ---------- */
const SETS = [
  ["Clasifica el hallazgo", "No conformidad, observación u oportunidad de mejora, y mayor o menor.", ["hall"]],
  ["Evidencia ↔ control", "Dada una evidencia, identifica el control del Anexo A.", ["ctrl"]],
  ["Indicadores", "Desempeño o efectividad, y nivel operativo, táctico o estratégico.", ["ind"]],
  ["Redacta la no conformidad", "Elementos, control citado y ciclo de acción correctiva.", ["nc"]],
  ["Riesgo y tratamiento", "Escenarios, opciones de tratamiento y SoA.", ["c6"]],
  ["Casos integradores", "Un banco regional y una tienda en línea.", ["caso"]],
  ["Auditoría y 19011", "Programa, plan, tipos, informe, reuniones y entrevistas.", ["aud"]]
];
function vPractica() {
  if (sess && sess.mode === "study") { renderSession(view, "Volver a práctica"); return; }
  view.innerHTML = `<section class="sheet"><h2>Práctica por tipo de ejercicio</h2><p class="mute small">Cada pregunta da la respuesta con su explicación al instante.</p></section>
  <div class="grid">${SETS.map((x, i) => { const n = BANK.filter(q => x[2].includes(q.t)).length, m = mastery(x[2][0]); return `<div class="sheet"><h3>${x[0]}</h3><p class="small mute">${x[1]}</p><div class="bar" style="margin:10px 0"><i style="width:${pct(m.good, m.total)}%"></i></div><div class="row sp"><span class="mono small mute">${m.good}/${n} dominadas</span><button class="btn sm" data-s="${i}">Empezar</button></div></div>`; }).join("")}</div>`;
  view.onclick = e => { const b = e.target.closest("[data-s]"); if (!b) return; const x = SETS[+b.dataset.s]; sess = makeSession(shuffle(BANK.filter(q => x[2].includes(q.t))), "study"); renderSession(view, "Volver a práctica"); window.scrollTo(0, 0); };
}

/* ---------- Banco ---------- */
function vBanco() {
  if (sess && sess.mode === "study") { renderSession(view, "Volver al banco"); return; }
  let tema = "all", cant = "20", modo = "all";
  const draw = () => {
    view.innerHTML = `<section class="sheet"><h2>Banco de preguntas</h2><p class="mute small">${BANK.length} preguntas. Elige tema, cantidad y filtro.</p>
    <div class="row" style="margin:12px 0">${["all"].concat(Object.keys(TEMAS)).map(t => { const m = mastery(t); return `<button class="chip" data-t="${t}" aria-pressed="${t === tema}">${t === "all" ? "Todos" : TEMAS[t]} <span class="mono small">${m.good}/${m.total}</span></button>`; }).join("")}</div>
    <div class="row"><label class="small mute" for="bc">Cantidad</label><select id="bc"><option value="10">10</option><option value="20">20</option><option value="all">Todas</option></select>
    <label class="small mute" for="bm">Filtro</label><select id="bm"><option value="all">Todas</option><option value="new">Solo no vistas</option><option value="ko">Solo falladas</option></select>
    <button class="btn" id="go">Empezar</button></div><p class="small mute" id="avail" style="margin-top:10px"></p></section>`;
    $("#bc").value = cant; $("#bm").value = modo;
    const pool = () => BANK.filter(q => (tema === "all" || q.t === tema) && (modo === "all" || (modo === "new" ? !S.stats[q.id] : (S.stats[q.id] && S.stats[q.id].last === false))));
    $("#avail").textContent = pool().length + " preguntas disponibles con este filtro.";
    view.onclick = e => { const b = e.target.closest("[data-t]"); if (b) { tema = b.dataset.t; cant = $("#bc").value; modo = $("#bm").value; draw(); } };
    $("#bc").onchange = e => { cant = e.target.value; }; $("#bm").onchange = e => { modo = e.target.value; draw(); };
    $("#go").onclick = () => { let p = shuffle(pool()); if (!p.length) return; if (cant !== "all") p = p.slice(0, +cant); sess = makeSession(p, "study"); renderSession(view, "Volver al banco"); window.scrollTo(0, 0); };
  };
  draw();
}

/* ---------- Simulacro ---------- */
const MIX = [["aud", 12], ["hall", 4], ["nc", 2], ["rev", 3], ["ind", 4], ["c6", 5], ["c4", 2], ["c5", 3], ["c78", 1], ["anexo", 2], ["ctrl", 2]];
function vSim() {
  if (sess && sess.mode === "sim") { renderSession(view, "Volver al simulacro"); return; }
  const hist = S.sims.slice(-5).reverse();
  view.innerHTML = `<section class="sheet"><h2>Simulacro de examen</h2>
  <p>40 preguntas, 60 minutos, aprobación con 80 % (32 aciertos). Sin respuestas hasta el final. Más de un tercio son de auditoría, como en el examen real.</p>
  <p class="small mute">El examen es de libro abierto: practica con el PDF de la norma a un lado y busca por palabra clave.</p>
  <div class="row" style="margin-top:12px"><button class="btn" id="go">Iniciar simulacro</button></div></section>
  ${hist.length ? `<section class="sheet"><h3>Tus últimos intentos</h3><div class="tw"><table><thead><tr><th>Fecha</th><th>Puntaje</th><th>Resultado</th><th>Tiempo</th></tr></thead><tbody>${hist.map(h => `<tr><td class="mono">${h.date}</td><td class="mono">${h.score}/${h.total} · ${pct(h.score, h.total)}%</td><td>${h.pass ? "Aprobado" : "No aprobado"}</td><td class="mono">${Math.floor(h.secs / 60)} min</td></tr>`).join("")}</tbody></table></div></section>` : ""}`;
  view.onclick = null;
  $("#go").onclick = () => {
    let qs = [];
    MIX.forEach(m => { qs = qs.concat(shuffle(BANK.filter(q => q.t === m[0])).slice(0, m[1])); });
    sess = makeSession(shuffle(qs), "sim", 3600); renderSession(view, "Volver al simulacro"); window.scrollTo(0, 0);
  };
}

/* ---------- Mis errores ---------- */
function vErrores() {
  const wrong = BANK.filter(q => S.stats[q.id] && S.stats[q.id].last === false);
  if (!wrong.length) { view.innerHTML = `<section class="sheet"><h2>Mis errores</h2><p class="mute">Aquí aparecerán las preguntas que falles. Por ahora no tienes ninguna pendiente.</p></section>`; view.onclick = null; return; }
  view.innerHTML = `<section class="sheet"><div class="row sp"><h2>Mis errores (${wrong.length})</h2><div class="row"><button class="btn sm" id="rep">Practicar estas</button><button class="btn ghost sm" id="cp">Copiar lista</button></div></div><p class="small mute" id="msg"></p></section>` +
    wrong.map(q => `<section class="sheet"><span class="tag">${esc(TEMAS[q.t])}</span><p class="qtext" style="margin-top:8px">${esc(q.q)}</p><p class="small"><b>Correcta:</b> ${esc(q.o[q.a])}</p><p class="small mute">${esc(q.w)} ${q.r ? `<span class="tag">${esc(q.r)}</span>` : ""}</p></section>`).join("");
  view.onclick = e => {
    if (e.target.id === "rep") { sess = makeSession(shuffle(wrong), "study"); location.hash = "banco"; if ((location.hash || "") === "#banco") route(); }
    if (e.target.id === "cp") {
      const txt = wrong.map(q => "- " + q.q + "\n  Correcta: " + q.o[q.a]).join("\n");
      const ok = () => { $("#msg").textContent = "Lista copiada."; };
      const fb = () => { $("#msg").innerHTML = "No se pudo copiar. Selecciona y copia desde aquí:<br><textarea id=\"ta\" rows=\"8\" style=\"width:100%;margin-top:6px\"></textarea>"; $("#ta").value = txt; $("#ta").select(); };
      try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (er) { fb(); }
    }
  };
}

route();
</script>
